# ForwardAuth dla Traefika — jedno logowanie dla wszystkich paneli.
# Kontener NIE jest wystawiony publicznie: widzi go wyłącznie Traefik
# (sieć traefik-public) i inne usługi stacku (sieć monitoring).
#
# UWAGA (pułapka, która cicho wyłącza uwierzytelnianie):
#   dyrektywa `return` wykonuje się w fazie REWRITE, czyli PRZED sprawdzeniem
#   `auth_basic` z fazy ACCESS. Gdyby /verify kończyło się `return 200`,
#   Traefik uznawałby KAŻDE żądanie za uwierzytelnione.
#   Dlatego treść serwujemy przez `try_files` (faza CONTENT — po access).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;

    root /usr/share/nginx/html;

    # Healthcheck kontenera (bez auth, tylko wewnątrz sieci)
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Traefik ForwardAuth: 200 = wpuszczony, 401 = brak/niepoprawne dane.
    # X-User jest przekazywany do usługi docelowej (m.in. do Grafany).
    location = /verify {
        auth_basic "monitoring";
        auth_basic_user_file /etc/nginx/htpasswd;
        add_header X-User $remote_user always;
        default_type text/plain;
        try_files /verify-ok.txt =403;
    }

    location / {
        return 404;
    }
}
