groups:
  - name: host_alerts
    interval: 15s
    rules:

      # ===== HOST CPU =====

      - alert: HostHighCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% (threshold: 85%) for more than 2 minutes."

      - alert: HostCriticalCPUUsage
        expr: |
          100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL CPU usage on {{ $labels.instance }}"
          description: "CPU usage is {{ $value | printf \"%.1f\" }}% - server may be unresponsive!"

      # ===== HOST MEMORY =====

      - alert: HostHighMemoryUsage
        expr: |
          100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}%. Available: {{ with query \"node_memory_MemAvailable_bytes\" }}{{ . | first | value | humanize1024 }}{{ end }}B"

      - alert: HostCriticalMemoryUsage
        expr: |
          100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL memory usage on {{ $labels.instance }}"
          description: "Memory usage is {{ $value | printf \"%.1f\" }}% - OOM killer may trigger!"

      # ===== HOST DISK =====

      - alert: HostDiskSpaceWarning
        expr: |
          100 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} * 100) > 75
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage warning on {{ $labels.instance }}"
          description: "Disk {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full."

      - alert: HostDiskSpaceCritical
        expr: |
          100 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
          / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} * 100) > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL disk space on {{ $labels.instance }}"
          description: "Disk {{ $labels.mountpoint }} is {{ $value | printf \"%.1f\" }}% full - URGENT!"

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}[6h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Disk will fill in 24h on {{ $labels.instance }}"
          description: "Based on current write rate, disk {{ $labels.mountpoint }} will be full within 24 hours."

      # ===== HOST NETWORK =====

      - alert: HostHighNetworkTraffic
        expr: |
          rate(node_network_receive_bytes_total{device!~"lo|docker.*|br-.*|veth.*|overlay.*"}[5m]) > 104857600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High inbound network on {{ $labels.instance }}"
          description: "Interface {{ $labels.device }} receives {{ $value | humanize1024 }}B/s (>100MB/s)."

      # ===== HOST LOAD =====

      - alert: HostSystemLoadHigh
        expr: |
          node_load1 > on(instance) count by(instance)(node_cpu_seconds_total{mode="idle"}) * 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High system load on {{ $labels.instance }}"
          description: "Load average (1m) is {{ $value | printf \"%.2f\" }} which is >1.5x number of CPUs."

      # ===== SERVICE UP/DOWN =====

      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Service DOWN: {{ $labels.job }}"
          description: "Service '{{ $labels.job }}' on {{ $labels.instance }} has been DOWN for more than 30 seconds!"

      - alert: MonitoringServiceDown
        expr: |
          up{job=~"prometheus|alertmanager|loki|cadvisor|node-exporter"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Monitoring service DOWN: {{ $labels.job }}"
          description: "Critical monitoring component '{{ $labels.job }}' is DOWN!"

  # ===== CONTAINER ALERTS (via cAdvisor - ALL containers, no labels needed) =====

  - name: container_alerts
    interval: 15s
    rules:

      - alert: ContainerDown
        expr: |
          (time() - container_last_seen{name!~"",name!~".*_POD_.*|.*pause.*"}) > 30
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Container DOWN: {{ $labels.name }}"
          description: "Container '{{ $labels.name }}' (stack: {{ $labels.swarm_stack }}) has not been seen for more than 30 seconds!"

      - alert: ContainerHighCPU
        expr: |
          rate(container_cpu_usage_seconds_total{name!~"",image!="",name!~".*_POD_.*"}[2m]) * 100 > 80
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Container high CPU: {{ $labels.name }}"
          description: "Container '{{ $labels.name }}' is using {{ $value | printf \"%.1f\" }}% CPU for more than 3 minutes."

      - alert: ContainerHighMemoryAbsolute
        expr: |
          container_memory_working_set_bytes{name!~"",image!="",name!~".*_POD_.*"} > 1073741824
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container using >1GB RAM: {{ $labels.name }}"
          description: "Container '{{ $labels.name }}' is using {{ $value | humanize1024 }}B of memory."

      - alert: ContainerMemoryLimitNear
        expr: |
          container_memory_working_set_bytes{name!~"",image!=""}
          / container_spec_memory_limit_bytes{name!~"",image!=""} > 0.85
          and container_spec_memory_limit_bytes{name!~"",image!=""} > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Container near memory limit: {{ $labels.name }}"
          description: "Container '{{ $labels.name }}' is using {{ $value | humanizePercentage }} of its memory limit."

      - alert: ContainerMemoryLimitCritical
        expr: |
          container_memory_working_set_bytes{name!~"",image!=""}
          / container_spec_memory_limit_bytes{name!~"",image!=""} > 0.98
          and container_spec_memory_limit_bytes{name!~"",image!=""} > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Container OOM imminent: {{ $labels.name }}"
          description: "Container '{{ $labels.name }}' exceeded 98% of memory limit - OOM kill imminent!"

      - alert: ContainerRestarting
        expr: |
          rate(container_start_time_seconds{name!~"",image!="",name!~".*_POD_.*"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container restarting: {{ $labels.name }}"
          description: "Container '{{ $labels.name }}' has been restarting frequently in the last 15 minutes."

      - alert: ContainerCPUThrottling
        expr: |
          rate(container_cpu_cfs_throttled_seconds_total{name!~"",image!=""}[5m])
          / rate(container_cpu_cfs_periods_total{name!~"",image!=""}[5m]) > 0.25
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container CPU throttled: {{ $labels.name }}"
          description: "Container '{{ $labels.name }}' is CPU throttled {{ $value | humanizePercentage }} of the time."

      - alert: ContainerHighDiskWrite
        expr: |
          rate(container_fs_writes_bytes_total{name!~"",image!=""}[5m]) > 52428800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container high disk write: {{ $labels.name }}"
          description: "Container '{{ $labels.name }}' is writing {{ $value | humanize1024 }}B/s (>50MB/s)."
