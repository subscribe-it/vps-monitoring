groups:
  - name: http_alerts
    interval: 15s
    rules:

      # HTTP endpoint down - alert after 30s
      - alert: HttpEndpointDown
        expr: probe_success{job="blackbox-http"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "HTTP endpoint DOWN: {{ $labels.instance }}"
          description: "Endpoint {{ $labels.instance }} is not responding to HTTP probe for more than 30 seconds!"

      # TCP endpoint down
      - alert: TcpEndpointDown
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "TCP endpoint DOWN: {{ $labels.instance }}"
          description: "TCP endpoint {{ $labels.instance }} is not reachable for more than 30 seconds! (Could be MariaDB/Redis down)"

      # SSL expiry warning - 14 days
      - alert: SSLCertificateExpiringSoon
        expr: |
          probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 86400 * 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "SSL cert expiring soon: {{ $labels.instance }}"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

      # SSL expiry critical - 3 days
      - alert: SSLCertificateExpiryCritical
        expr: |
          probe_ssl_earliest_cert_expiry{job="blackbox-http"} - time() < 86400 * 3
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "SSL cert expiring in 3 days: {{ $labels.instance }}"
          description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}!"

      # Slow HTTP response > 3s
      - alert: SlowHttpResponse
        expr: probe_duration_seconds{job="blackbox-http"} > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Slow HTTP response: {{ $labels.instance }}"
          description: "Endpoint {{ $labels.instance }} is responding in {{ $value | printf \"%.2f\" }}s (threshold: 3s)."

      # HTTP response not 2xx (wrong status code)
      - alert: HttpWrongStatusCode
        expr: |
          probe_http_status_code{job="blackbox-http"} != 200
          and probe_http_status_code{job="blackbox-http"} != 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Unexpected HTTP status: {{ $labels.instance }}"
          description: "Endpoint {{ $labels.instance }} returned status {{ $value }} (expected 2xx)."
