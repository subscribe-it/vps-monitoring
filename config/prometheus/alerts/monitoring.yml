groups:
  - name: monitoring_self
    interval: 30s
    rules:

      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Alertmanager nie odpowiada"
          description: "Alerty są wykrywane, ale nie mają jak dotrzeć do Ciebie. Sprawdź natychmiast."
          runbook: "#selfhealth"

      - alert: NotifierDown
        expr: up{job="notifier"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Notifier (ntfy/e-mail) nie odpowiada"
          description: "Alertmanager ma gdzie wysyłać, ale odbiorca nie żyje — powiadomienia nie dotrą."
          runbook: "#selfhealth"

      - alert: GrafanaDown
        expr: up{job="grafana"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Grafana nie odpowiada"
          description: "Dashboardy i przeglądanie logów są niedostępne."
          runbook: "#selfhealth"

      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki nie odpowiada"
          description: "Zbieranie logów stoi — alerty logowe (m.in. o błędach bazy) są nieaktywne."
          runbook: "#selfhealth"

      - alert: PromtailDown
        expr: up{job="promtail"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Promtail nie odpowiada"
          description: "Logi przestaną docierać do Lokiego — tracisz możliwość analizy po fakcie."
          runbook: "#selfhealth"

      - alert: DiscoveryDown
        expr: up{job="discovery"} == 0 or discovery_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Auto-discovery nie działa"
          description: "Bez discovery nie ma sond nowych aplikacji ani metryk replik — monitoring aplikacji jest ślepy."
          runbook: "#selfhealth"

      - alert: HealthPingDown
        expr: up{job="health-ping"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Watchdog healthchecks.io nie działa"
          description: "Zewnętrzny watchdog przestanie dostawać sygnał i zacznie alarmować o awarii, której nie ma."
          runbook: "#selfhealth"

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus nie przeładował konfiguracji"
          description: "Ostatnia zmiana konfiguracji nie weszła w życie."
          runbook: "#selfhealth"

      - alert: PrometheusRuleEvaluationFailing
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Reguły alertów zwracają błędy"
          description: "{{ $value | printf \"%.0f\" }} nieudanych ewaluacji w 15 minut — część alertów może nie działać."
          runbook: "#selfhealth"

      - alert: PrometheusNoTargets
        expr: absent(up{job="node-exporter"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus nie widzi żadnych celów"
          description: "Brak metryki up dla node-exportera — zbieranie metryk nie działa."
          runbook: "#selfhealth"

      # Siatka bezpieczeństwa: dowolny cel zbierania metryk, który przestał odpowiadać.
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cel zbierania metryk nie odpowiada: {{ $labels.job }}"
          description: "{{ $labels.instance }} nie odpowiada na scrapowanie od ponad 5 minut."
          runbook: "#selfhealth"

      # Dead-man's switch: ten alert JEST ZAWSZE aktywny i co 5 minut pinguje
      # healthchecks.io. Cisza po stronie zewnętrznej = padł host albo monitoring.
      - alert: Watchdog
        expr: vector(1)
        for: 0m
        labels:
          severity: none
          watchdog: "true"
        annotations:
          summary: "Watchdog monitoringu"
          description: "Ten alert nie opisuje awarii — jest dowodem, że stack monitoringu żyje i potrafi wysyłać alerty."
          runbook: "#watchdog"
