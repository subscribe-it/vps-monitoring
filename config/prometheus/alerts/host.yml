groups:
  - name: host
    interval: 30s
    rules:

      # Wybieramy realne systemy plików: bez tmpfs/overlay i bez wnętrzności Dockera.
      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|ramfs|squashfs|autofs",mountpoint!~"/var/lib/docker/.+|/run/.+|/sys/.+|/proc/.+"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|ramfs|squashfs|autofs",mountpoint!~"/var/lib/docker/.+|/run/.+|/sys/.+|/proc/.+"}) * 100 < 15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Mało miejsca na {{ $labels.mountpoint }} ({{ $labels.instance }})"
          description: "Wolne: {{ $value | printf \"%.1f\" }}%. Przy 8% alert zmieni się w krytyczny."
          runbook: "#disk"

      - alert: HostDiskSpaceCritical
        expr: |
          (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|ramfs|squashfs|autofs",mountpoint!~"/var/lib/docker/.+|/run/.+|/sys/.+|/proc/.+"}
           / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|ramfs|squashfs|autofs",mountpoint!~"/var/lib/docker/.+|/run/.+|/sys/.+|/proc/.+"}) * 100 < 8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Krytycznie mało miejsca na {{ $labels.mountpoint }}"
          description: "Wolne: {{ $value | printf \"%.1f\" }}%. Ryzyko zatrzymania zapisów bazy i kontenerów."
          runbook: "#disk"

      - alert: HostDiskWillFillIn24h
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|ramfs|squashfs|autofs",mountpoint!~"/var/lib/docker/.+|/run/.+|/sys/.+|/proc/.+"}[6h], 86400) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Dysk zapełni się w ciągu 24 h: {{ $labels.mountpoint }}"
          description: "Przy obecnym tempie wzrostu zabraknie miejsca w ciągu doby (prognoza z 6 h)."
          runbook: "#disk"

      - alert: HostInodesLow
        expr: |
          (node_filesystem_files_free{fstype!~"tmpfs|overlay|ramfs|squashfs|autofs"} / node_filesystem_files{fstype!~"tmpfs|overlay|ramfs|squashfs|autofs"}) * 100 < 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Mało wolnych i-węzłów: {{ $labels.mountpoint }}"
          description: "Wolne: {{ $value | printf \"%.1f\" }}%. Skończenie i-węzłów zatrzymuje zapisy tak samo jak brak miejsca."
          runbook: "#disk"

      - alert: HostFilesystemReadonly
        expr: node_filesystem_readonly{fstype!~"tmpfs|overlay|ramfs|squashfs|autofs"} == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "System plików tylko do odczytu: {{ $labels.mountpoint }}"
          description: "Remount na read-only to typowy objaw błędu dysku lub systemu plików. Sprawdź natychmiast: dmesg, logi jądra, stan dysku."
          runbook: "#disk"

      - alert: HostMemoryPressure
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Brakuje pamięci (dostępne {{ $value | printf \"%.1f\" }}%)"
          description: "Swap jest wyłączony (0 B), więc presja pamięci kończy się OOM killerem bez ostrzeżenia. Sprawdź, który kontener rośnie."
          runbook: "#memory"

      - alert: HostMemoryPressureWarning
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 20
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Pamięć schodzi poniżej 20% ({{ $value | printf \"%.1f\" }}%)"
          description: "Zapas na bufor cache topnieje — to sygnał wyprzedzający przed OOM."
          runbook: "#memory"

      - alert: HostOomKill
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "OOM killer zabił proces na hoście"
          description: "W ciągu 15 minut odnotowano {{ $value | printf \"%.0f\" }} zdarzeń OOM. Sprawdź, która usługa zniknęła z listy działających."
          runbook: "#memory"

      - alert: HostLoadHigh
        expr: node_load15 / on(instance) group_left() count by (instance) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Wysokie obciążenie ({{ $value | printf \"%.2f\" }} na rdzeń)"
          description: "Średnia 15-minutowa przekracza 1,5 obciążenia na rdzeń przez 15 minut."
          runbook: "#load"

      - alert: HostRebooted
        expr: changes(node_boot_time_seconds[20m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Host został zrestartowany"
          description: "Wykryto zmianę czasu startu systemu — wszystkie usługi wstały ponownie."
          runbook: "#reboot"

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Przesunięcie zegara hosta: {{ $value | printf \"%.2f\" }} s"
          description: "Rozjechany zegar psuje odnowienia ACME, podpisy i znaczniki czasu w backupach."
          runbook: "#clock"

      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "node-exporter nie odpowiada"
          description: "Bez node-exportera monitoring hosta (dysk, pamięć, obciążenie) jest ślepy."
          runbook: "#monitoringchainbroken"
