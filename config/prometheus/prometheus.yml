# =============================================================================
#  Prometheus — konfiguracja dla stacku monitoring (ovh-vps-1)
#  Wszystkie cele są WEWNĘTRZNE (sieć overlay monitoring) — nic nie wychodzi
#  na zewnątrz poza sondami HTTP do publicznych adresów aplikacji.
#  Plik jest wypalony w obrazie (dockerfiles/prometheus) — brak sekretów.
# =============================================================================
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: 'ovh-vps-1'
    role: 'monitoring'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
      timeout: 10s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:

  # --- własne usługi stacku (samo-monitoring) --------------------------------
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    # Grafana chodzi w trybie sub-path (GF_SERVER_SERVE_FROM_SUB_PATH=true),
    # więc jej endpointy są pod prefiksem z GF_SERVER_ROOT_URL — metryki pod
    # `/grafana/metrics`, nie `/metrics`. Zmierzone: `up{job="grafana"}` = 0,
    # a alerty ScrapeTargetDown i GrafanaDown dzwoniły, mimo że Grafana działała.
    metrics_path: '/grafana/metrics'

  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  - job_name: 'promtail'
    static_configs:
      - targets: ['promtail:9080']

  - job_name: 'discovery'
    static_configs:
      - targets: ['discovery:8080']

  - job_name: 'health-ping'
    static_configs:
      - targets: ['health-ping:8080']

  - job_name: 'notifier'
    static_configs:
      - targets: ['notifier:8080']

  # --- host ---------------------------------------------------------------
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # --- sondy własnego łańcucha publicznego (DNS → cert → Traefik → auth) ----
  # Moduł http_expect_auth oczekuje kodu 401: to DOWÓD, że cały łańcuch żyje,
  # a my nie wkładamy nigdzie poświadczeń.
  - job_name: 'blackbox-monitoring'
    metrics_path: /probe
    params:
      module: [http_expect_auth]
    static_configs:
      - targets:
          - https://monitoring.subscribeit.pl/
          - https://monitoring.subscribeit.pl/grafana
          - https://monitoring.subscribeit.pl/prometheus
          - https://monitoring.subscribeit.pl/alertmanager
          - https://monitoring.subscribeit.pl/status/api.json
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- sondy aplikacji wykrytych automatycznie (auto-discovery) -------------
  # Lista celów pochodzi z serwisu discovery (HTTP SD) i odświeża się co 30 s.
  # Nowa aplikacja w Portainerze = nowy cel sondowania bez zmian w tym pliku.
  - job_name: 'blackbox-public'
    metrics_path: /probe
    http_sd_configs:
      - url: http://discovery:8080/sd/http.json
        refresh_interval: 30s
    relabel_configs:
      # moduł sondy wskazany przez discovery (etykieta z SD)
      - source_labels: [module]
        target_label: __param_module
      # cel sondy = adres docelowy
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      # zachowaj etykiety klasyfikacji z discovery
      - source_labels: [stack]
        target_label: stack
      - source_labels: [service]
        target_label: service
      - source_labels: [severity]
        target_label: severity

  # --- czy sam edge przyjmuje ruch ------------------------------------------
  - job_name: 'blackbox-edge-tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - monitoring.subscribeit.pl:443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # --- porty administracyjne: NIE mogą być publiczne ------------------------
  # Sonda działa z TEGO SAMEGO VPS-a (ruch wychodzi na publiczny adres i wraca),
  # więc wykrywa „port odpowiada na publicznym adresie", ale NIE zastępuje
  # skanowania z internetu — to robi krok smoke w CI (runner GitHuba).
  # Kolejność ma znaczenie: gdy port jest zamknięty, probe_success = 0.
  - job_name: 'blackbox-admin-ports'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 57.129.41.248:9090   # Cockpit
          - 57.129.41.248:9443   # Portainer (HTTPS)
          - 57.129.41.248:2375   # Docker API (bez TLS)
          - 57.129.41.248:2376   # Docker API (TLS)
          - 57.129.41.248:5432   # PostgreSQL
          - 57.129.41.248:3306   # MySQL / MariaDB
          - 57.129.41.248:6379   # Redis
          - 57.129.41.248:9200   # Elasticsearch
          - 57.129.41.248:11211  # memcached
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - target_label: severity
        replacement: critical
