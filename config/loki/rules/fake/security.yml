groups:
  - name: security-logs
    interval: 30s
    rules:

      # Każde udane logowanie do hosta jest zdarzeniem wartym odnotowania.
      - alert: SshLoginAccepted
        expr: |
          sum by (unit) (count_over_time({job="journald", unit="ssh.service"} |~ "Accepted (publickey|password) for" [5m])) > 0
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "Udane logowanie SSH do hosta"
          description: "Ktoś zalogował się przez SSH. Jeśli to nie Ty — działaj natychmiast: sprawdź klucze w ~/.ssh/authorized_keys i podejrzane procesy."
          runbook: "#security"

      - alert: SshAuthFailuresSpike
        expr: |
          sum by (unit) (count_over_time({job="journald", unit="ssh.service"}
            |~ "(?i)Failed password|Invalid user|Connection closed by authenticating user" [5m])) > 50
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Skok nieudanych logowań SSH"
          description: "{{ $value | printf \"%.0f\" }} nieudanych prób w 5 minut. fail2ban blokuje adresy, ale to potwierdza trwający atak słownikowy."
          runbook: "#security"

      # UWAGA (zmierzone 22.09.2026): fail2ban zapisuje bany do
      # /var/log/fail2ban.log, a do journala tylko start/stop — ta reguła
      # nie zapali się, dopóki promtail nie zbierze tego pliku
      # (montaż /var/log + job `fail2ban`). Do tego czasu traktuj ją jako
      # przygotowaną, nie jako działającą ochronę.
      - alert: Fail2banBanSpike
        expr: |
          sum by (unit) (count_over_time({job="journald", unit="fail2ban.service"} |~ "Ban " [15m])) > 5
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "fail2ban zablokował nowe adresy"
          description: "{{ $value | printf \"%.0f\" }} nowych banów w 15 minut — na hosta trwa aktywny atak."
          runbook: "#security"

      # Cockpit to panel z uprawnieniami roota wystawiony do internetu (9090).
      - alert: CockpitLogin
        expr: |
          sum(count_over_time({job="journald", unit=~"cockpit.+"} |~ "(?i)successful login|logged in|login for user|session (opened|started)|new session|authentication" [10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Logowanie do Cockpita"
          description: "W logach Cockpita pojawiła się informacja o logowaniu (udanym lub nieudanym) — port 9090 jest publiczny. Sprawdź, czy to Ty. Jeśli reguła milczy przy realnych logowaniach, dopasuj wzorzec do faktycznego formatu logów."
          runbook: "#security"
