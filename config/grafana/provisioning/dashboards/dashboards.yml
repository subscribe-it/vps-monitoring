# =============================================================================
#  Grafana — provisioning dashboardow (jako kod, bez klikania w UI)
#
#  Pliki JSON leza w config/grafana/dashboards/ i sa wypalane w obrazie
#  (dockerfiles/grafana: COPY config/grafana/dashboards /etc/grafana/dashboards).
#
#  UWAGA: celowo POZA /var/lib/grafana. Ten katalog jest wolumenem
#  (grafana_data_v2), a Docker kopiuje do wolumenu zawartosc obrazu tylko przy
#  jego pierwszym utworzeniu — pozniejsze zmiany dashboardow w obrazie byly
#  zaslaniane przez wolumen i Grafana ich nie widziala (zmierzone 2026-09-22:
#  nowy dashboard byl w obrazie, a `/api/search` pokazywalo 4 z 5).
#
#  foldersFromFilesStructure: false — wszystkie dashboardy ladują w jednym
#  folderze "Monitoring" (kluczowe dla dashboardu aplikacji: jeden dashboard
#  obsluguje wszystkie aplikacje, lista wyboru pochodzi ze zmiennych).
#  allowUiUpdates: false — dashboardy sa wylacznie kodem; zmiany z UI nie
#  przetrwaja restartu, wiec nie udajemy, ze mozna je zapisac.
# =============================================================================
apiVersion: 1

providers:
  - name: monitoring
    orgId: 1
    folder: Monitoring
    folderUid: monitoring
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false
