server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker containers logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: ["running"]
    relabel_configs:
      # Set job label from container name
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: job
        replacement: '${1}'
      
      # Set container_name label
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container_name
        replacement: '${1}'
      
      # Set service name from label
      - source_labels: [__meta_docker_container_label_com_docker_swarm_service_name]
        target_label: service_name
      
      # Set app labels if available
      - source_labels: [__meta_docker_container_label_app_name]
        target_label: app_name
      - source_labels: [__meta_docker_container_label_app_type]
        target_label: app_type
      
      # Set instance from container ID
      - source_labels: [__meta_docker_container_id]
        target_label: instance
        replacement: '${1}'
      
      # Set log path
      - source_labels: [__meta_docker_container_id]
        target_label: __path__
        replacement: '/var/lib/docker/containers/${1}/*.log'
    
    pipeline_stages:
      # Parse JSON logs (Docker JSON log driver format)
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      
      # Extract timestamp from JSON log
      - timestamp:
          source: time
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - Unix
      
      # Output: use parsed log field if available, otherwise use raw line
      - output:
          source: output
      
      # Extract log level if present
      - regex:
          expression: '(?i).*level[=:]\s*(?P<level>\w+).*|(?i).*\b(?P<level>ERROR|WARN|WARNING|INFO|DEBUG|TRACE|FATAL)\b.*'
      - labels:
          level:
      
      # Add Docker stream label (stdout/stderr)
      - labels:
          stream:

  # System logs (optional)
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/*.log


