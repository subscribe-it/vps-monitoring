# Promtail — zbieranie logów z trzech źródeł:
#   1. kontenery (przez Docker API, bo driver logowania to "local", nie "json-file")
#   2. journald hosta (sshd, cockpit, fail2ban, jądro)
#   3. access log Traefika z cudzego wolumenu (tylko do odczytu)
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

# Pozycje czytania leżą na WOLUMENIE (montaż `promtail_positions:/positions`
# w docker-compose.yml), a nie w /tmp. W /tmp ginęły przy każdym restarcie
# kontenera, a wtedy promtail czyta wszystkie pliki od początku — razem z wpisami
# starszymi niż 7 dni, które Loki odrzuca (HTTP 400 „timestamp too old”), gubiąc
# całe paczki. Zmierzone 22.09.2026 przy odtwarzaniu stacku: 299 odrzuconych
# paczek i 39,6 MB logów straconych.
positions:
  filename: /positions/positions.yaml

clients:
  - url: ${LOKI_URL}
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:

  # --- 1) logi kontenerów ---------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name']
        target_label: service
      # `stack` MUSI być czytane z `com.docker.stack.namespace`. Docker NIE
      # ustawia kontenerom `com.docker.swarm.stack.namespace` (sprawdzone
      # 22.09.2026 na żywym promtailu: /targets pokazuje 156 wystąpień
      # `com_docker_stack_namespace` i ZERO `com_docker_swarm_stack_namespace`).
      # Poprzednia wersja czytała tę nieistniejącą etykietę, więc `stack` było
      # puste, Loki puste etykiety pomija — i wszystko, co filtruje po `stack=`,
      # milczało: panel „Logi — przeglądanie” (zmienna `stack` z `label_values`)
      # był pusty, a reguły Lokiego z `{stack="…”}` nie mogły się zapalić.
      - source_labels: ['__meta_docker_container_label_com_docker_stack_namespace']
        target_label: stack
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - target_label: job
        replacement: docker
      - target_label: host
        replacement: ${HOSTNAME}
      # Nie zbieraj logów samego monitoringu — to pętla i szum.
      - action: drop
        source_labels: ['__meta_docker_container_name']
        regex: '/(monitoring_(loki|promtail|discovery|health-ping|notifier|auth|panel)).*'

  # --- 2) journald hosta ----------------------------------------------------
  - job_name: journal
    journal:
      path: /var/log/journal
      max_age: 12h
      labels:
        job: journald
        host: ${HOSTNAME}
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      - source_labels: ['__journal__transport']
        target_label: transport
      - source_labels: ['__journal_priority_keyword']
        target_label: level
      - action: keep
        source_labels: ['__journal__systemd_unit', '__journal__transport']
        regex: '(ssh\.service|cockpit[^;]*|fail2ban\.service|docker\.service|containerd\.service);.*|;kernel'

  # --- 3) access log Traefika (cudzy wolumen, tylko :ro) --------------------
  # Zmierzone 22.09.2026: plik `/traefik-logs/access.log` istnieje i rośnie
  # (2,0 MB, ~2,3 tys. wpisów/h), a promtail przeczytał go w całości — czyli
  # access log edge JEST włączony i alert TraefikNoAccessLogs słusznie milczy.
  # Kontener Traefika montuje ten sam wolumen jako `/var/log/traefik`.
  # `RequestHost` z JSON-a jest etykietą strumienia, więc filtrowanie po domenie
  # działa bez `| json`. Uwaga: nginx z ModSecurity w edge (cudzy stack) NIE
  # loguje żądań do stdout — jego blokady widać wyłącznie jako 403/429 tutaj.
  - job_name: traefik
    static_configs:
      - targets: [localhost]
        labels:
          job: traefik
          host: ${HOSTNAME}
          __path__: /traefik-logs/access.log
    pipeline_stages:
      - json:
          expressions:
            RequestHost: RequestHost
            DownstreamStatus: DownstreamStatus
            Duration: Duration
            ClientHost: ClientHost
            RouterName: RouterName
            ServiceName: ServiceName
            RequestPath: RequestPath
      - labels:
          RequestHost:
      - timestamp:
          source: StartUTC
          format: RFC3339Nano
          fallback_formats: ['RFC3339']
