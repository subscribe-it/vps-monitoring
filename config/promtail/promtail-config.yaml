# Promtail — zbieranie logów z trzech źródeł:
#   1. kontenery (przez Docker API, bo driver logowania to "local", nie "json-file")
#   2. journald hosta (sshd, cockpit, fail2ban, jądro)
#   3. access log Traefika z cudzego wolumenu (tylko do odczytu)
server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}
    batchwait: 1s
    batchsize: 1048576
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10

scrape_configs:

  # --- 1) logi kontenerów ---------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_service_name']
        target_label: service
      - source_labels: ['__meta_docker_container_label_com_docker_swarm_stack_namespace']
        target_label: stack
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - target_label: job
        replacement: docker
      - target_label: host
        replacement: ${HOSTNAME}
      # Nie zbieraj logów samego monitoringu — to pętla i szum.
      - action: drop
        source_labels: ['__meta_docker_container_name']
        regex: '/(monitoring_(loki|promtail|discovery|health-ping|notifier|auth|panel)).*'

  # --- 2) journald hosta ----------------------------------------------------
  - job_name: journal
    journal:
      path: /var/log/journal
      max_age: 12h
      labels:
        job: journald
        host: ${HOSTNAME}
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      - source_labels: ['__journal__transport']
        target_label: transport
      - source_labels: ['__journal_priority_keyword']
        target_label: level
      - action: keep
        source_labels: ['__journal__systemd_unit', '__journal__transport']
        regex: '(ssh\.service|cockpit[^;]*|fail2ban\.service|docker\.service|containerd\.service);.*|;kernel'

  # --- 3) access log Traefika (cudzy wolumen, tylko :ro) --------------------
  - job_name: traefik
    static_configs:
      - targets: [localhost]
        labels:
          job: traefik
          host: ${HOSTNAME}
          __path__: /traefik-logs/access.log
    pipeline_stages:
      - json:
          expressions:
            RequestHost: RequestHost
            DownstreamStatus: DownstreamStatus
            Duration: Duration
            ClientHost: ClientHost
            RouterName: RouterName
            ServiceName: ServiceName
            RequestPath: RequestPath
      - labels:
          RequestHost:
      - timestamp:
          source: StartUTC
          format: RFC3339Nano
          fallback_formats: ['RFC3339']
