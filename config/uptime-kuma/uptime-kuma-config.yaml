# Uptime Kuma Configuration
# This file is loaded by the initialization script to configure Uptime Kuma

# Default monitors to create on startup
monitors:
  # Example: Prometheus monitoring
  - name: "Prometheus"
    type: "http"
    url: "http://prometheus:9090/-/healthy"
    interval: 60
    retries: 2
    timeout: 10
    
  # Example: Grafana monitoring
  - name: "Grafana"
    type: "http"
    url: "http://grafana:3000/api/health"
    interval: 60
    retries: 2
    timeout: 10
    
  # Example: Loki monitoring
  - name: "Loki"
    type: "http"
    url: "http://loki:3100/ready"
    interval: 60
    retries: 2
    timeout: 10

# Notification settings (optional)
notifications:
  # Telegram notification (if configured)
  telegram:
    enabled: false
    bot_token: "${TELEGRAM_BOT_TOKEN:-}"
    chat_id: "${TELEGRAM_CHAT_ID:-}"

# General settings
settings:
  # Auto-restart services on failure (requires Docker API access)
  auto_restart: false
  
  # Check interval in seconds
  default_interval: 60
  
  # Retry count
  default_retries: 2
  
  # Timeout in seconds
  default_timeout: 10

