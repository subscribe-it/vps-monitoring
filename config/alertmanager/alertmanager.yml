global:
  resolve_timeout: 5m

route:
  receiver: 'telegram-default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    # Critical alerts - immediate notification, repeat every 1 hour
    - match:
        severity: critical
      receiver: 'telegram-critical'
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 1h
      continue: true
    # Warning alerts - repeat every 6 hours
    - match:
        severity: warning
      receiver: 'telegram-warning'
      group_wait: 30s
      group_interval: 10m
      repeat_interval: 6h
      continue: true
    # Default - all other alerts, repeat every 12 hours
    - receiver: 'telegram-default'

receivers:
  - name: 'telegram-default'
    webhook_configs:
      - url: 'http://telegram-webhook:8088/webhook'
        send_resolved: true
        http_config:
          follow_redirects: true

  - name: 'telegram-critical'
    webhook_configs:
      - url: 'http://telegram-webhook:8088/webhook'
        send_resolved: true
        http_config:
          follow_redirects: true

  - name: 'telegram-warning'
    webhook_configs:
      - url: 'http://telegram-webhook:8088/webhook'
        send_resolved: true
        http_config:
          follow_redirects: true

inhibit_rules:
  # Inhibit any warning-level notification if the same alert is already firing critical
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
