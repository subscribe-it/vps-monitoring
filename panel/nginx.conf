# Panel monitoringu — serwowanie statyczne na porcie 80.
#
# Uwaga na pułapkę nginx: dyrektywy `add_header` NIE dziedziczą się do bloku
# `location`, który ma własny `add_header`. Dlatego nagłówki bezpieczeństwa są
# powtórzone w każdym miejscu, które ustawia własne nagłówki.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Bez wycieku wersji nginx w nagłówku `Server` i na stronach błędów.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    default_type application/octet-stream;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    client_max_body_size 1m;

    # Probe dla healthchecka kontenera.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        default_type text/plain;
    }

    # Dokument wejściowy zawsze świeży — panel ma pokazywać bieżący stan.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    # Assety z Astro mają hash w nazwie — mogą być cache'owane na rok.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Wszystko pozostałe: pliki statyczne, a dla nieznanych ścieżek index.html
    # (routing panelu odbywa się po hashu, więc każda ścieżka obsłuży widok stanu).
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # ---------------------------------------------------------------------
    # Ten kontener serwuje WYŁĄCZNIE statyczny panel. `/status/api.json`
    # oraz narzędzia (Grafana, Prometheus, Alertmanager) są trasowane przez
    # zewnętrzny reverse proxy na tym samym originie — dzięki temu panel
    # czyta dane i osadza narzędzia w iframe bez CORS i bez logowania po raz
    # drugi. Gdyby ktoś chciał, żeby ten kontener był jedynym wejściem,
    # wystarczy odkomentować blok poniżej i ustawić adres usługi statusu:
    #
    # location /status/ {
    #     proxy_pass http://status-api:8080/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     add_header Cache-Control "no-store" always;
    # }
    # ---------------------------------------------------------------------
}
