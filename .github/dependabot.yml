# Automatyczne aktualizacje zależności.
# Obrazy są pinowane do konkretnych wersji (celowo — brak `:latest`),
# więc bez tego kota zostałyby zamrożone na zawsze.
#
# Uwaga: Dependabot NIE schodzi w głąb katalogów, dlatego każdy katalog
# z Dockerfile jest wymieniony osobno (klucz `directories`).
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - "/"                          # docker-compose.yml (obrazy zewnętrzne)
      - "/dockerfiles/prometheus"
      - "/dockerfiles/alertmanager"
      - "/dockerfiles/loki"
      - "/dockerfiles/promtail"
      - "/dockerfiles/grafana"
      - "/dockerfiles/auth"
      - "/services/discovery"
      - "/services/notifier"
      - "/services/health-ping"
      - "/panel"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      obrazy-monitoringu:
        patterns: ["*"]

  # Panel: rzadziej niż obrazy, bo aktualizacje Astro/Tailwind są najmniej pilne.
  - package-ecosystem: npm
    directory: /panel
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      panel:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    groups:
      akcje:
        patterns: ["*"]
