name: Validate

# Uwaga dla przyszłych edycji: wewnątrz bloków `run: |` NIE używaj heredoców
# (terminator musiałby stać w kolumnie 0 i rozerwałby YAML — dokładnie tak raz
# zepsułem ten plik). Logikę trzymaj w scripts/ci/*.py i wywołuj ją jednym poleceniem.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nowy push anuluje poprzednią walidację tego samego brancha — bez tego seria
# commitów uruchamiała kilka pełnych zestawów 9 jobów równolegle.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ciężkie joby (kontenery Loki/Prometheus/Alertmanager, build panelu) uruchamiamy
  # tylko wtedy, gdy zmieniły się pliki, które one sprawdzają. Reszta jobów jest
  # tania (kilkanaście sekund), więc chodzi zawsze.
  zmiany:
    name: Co się zmieniło
    runs-on: ubuntu-latest
    outputs:
      dashboards: ${{ steps.f.outputs.dashboards }}
      panel: ${{ steps.f.outputs.panel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: f
        name: Które zestawy testów mają sens
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "origin/${{ github.base_ref }}...HEAD" > /tmp/z 2>/dev/null || echo ALL > /tmp/z
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > /tmp/z 2>/dev/null; then
            :
          else
            echo ALL > /tmp/z
          fi
          if grep -q '^ALL$' /tmp/z || grep -q '^.github/workflows/validate.yml$' /tmp/z; then
            echo "wszystko (zmiana workflowu albo nie wiem, co się zmieniło)"
            d=true; p=true
          else
            grep -qE '^(config/(prometheus|loki|grafana)/|scripts/ci/check_dashboard_queries.py|scripts/ci/check_ruler_loaded.py|tests/integration/verify_log)' /tmp/z && d=true || d=false
            grep -q '^panel/' /tmp/z && p=true || p=false
          fi
          echo "dashboards=$d" >> "$GITHUB_OUTPUT"
          echo "panel=$p" >> "$GITHUB_OUTPUT"
          echo "  dashboardy: $d | panel: $p"

  compose:
    name: Compose / zasady stacku
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Walidacja schematem SWARMA (autorytatywna — to on wdraża stack)"
        env:
          PANEL_AUTH_PASSWORD_HTPASSWD: 'admin:$apr1$abcdefgh$0123456789abcdefghij'
          GRAFANA_ADMIN_PASSWORD: 'placeholder-password'
        run: |
          # `docker compose config` przepuszcza klucze, których Swarm NIE ZNA
          # (np. group_add) — a `docker stack deploy` odrzuca wtedy CAŁY plik.
          # Dlatego walidujemy schematem Swarma i to jego wynik analizujemy dalej.
          docker stack config -c docker-compose.yml > /tmp/rendered.yml
          echo "  ✓ stack przechodzi walidację Swarma"

      - name: "Zasady stacku: zero portów, zero configów, cudze montowania tylko :ro, limity"
        run: python3 scripts/ci/check_compose_rules.py

      - name: "Lint flag (klasa błędu: --flaga=false wysadza Prometheusa)"
        run: python3 scripts/ci/lint_shell_flags.py

  prometheus:
    name: Prometheus (config + reguły + testy reguł)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: promtool check config
        run: |
          docker run --rm -v "$PWD/config/prometheus:/p:ro" --entrypoint /bin/promtool \
            prom/prometheus:v3.14.0 check config /p/prometheus.yml

      - name: promtool check rules
        run: |
          docker run --rm -v "$PWD/config/prometheus:/p:ro" --entrypoint /bin/sh \
            prom/prometheus:v3.14.0 -c '/bin/promtool check rules /p/alerts/*.yml'

      - name: Testy reguł — dowód, że progi faktycznie się zapalają
        run: |
          docker run --rm -v "$PWD/config/prometheus:/p:ro" --entrypoint /bin/sh \
            prom/prometheus:v3.14.0 \
            -c 'for f in /p/tests/*.yml; do echo "--- $f"; /bin/promtool test rules "$f" || exit 1; done'

  loki:
    name: Loki (config + reguły logowe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Weryfikacja konfiguracji Loki
        run: |
          docker run --rm -v "$PWD/config/loki:/l:ro" -e LOKI_RETENTION=720h \
            grafana/loki:3.6.17 -config.file=/l/loki-config.yaml -config.expand-env=true -verify-config=true

      - name: Reguły alertów logowych (YAML + komplet pól)
        run: |
          python3 -c "import glob, sys, yaml; pliki = glob.glob('config/loki/rules/**/*.yml', recursive=True); zle = [f'{f}: {r.get(\"alert\")}' for f in pliki for g in yaml.safe_load(open(f))['groups'] for r in g['rules'] if not r.get('expr') or not r.get('alert')]; print(f'  OK: {len(pliki)} plików reguł'); sys.exit(1 if zle else 0)"

      - name: Wzorce LogQL, które w Loki dopasują nic
        run: python3 scripts/ci/check_loki_regex.py

  grafana:
    name: Grafana (provisioning + dashboardy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/check_grafana.py

  images:
    name: Spójność obrazów (compose ↔ macierz buildów)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Każdy własny obraz ma job budujący
        env:
          PANEL_AUTH_PASSWORD_HTPASSWD: 'admin:$apr1$abcdefgh$0123456789abcdefghij'
          GRAFANA_ADMIN_PASSWORD: 'placeholder-password'
        run: |
          docker compose -f docker-compose.yml config > /tmp/rendered.yml
          python3 scripts/ci/check_images.py

  runbook:
    name: Spójność alertów z runbookiem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ci/check_runbook.py


  dashboards:
    name: Dashboardy (składnia zapytań PromQL i LogQL)
    needs: zmiany
    if: needs.zmiany.outputs.dashboards == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Uruchom Prometheusa i Loki do walidacji zapytań
        run: |
          docker network create walidacja
          docker run -d --name walidacja-prometheus --network walidacja -p 127.0.0.1:9090:9090 \
            -v "$PWD/config/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.path=/tmp --web.enable-lifecycle
          docker run -d --name walidacja-loki --network walidacja -p 127.0.0.1:3100:3100 \
            -v "$PWD/config/loki:/etc/loki:ro" -e LOKI_RETENTION=24h \
            grafana/loki:3.6.17 \
            -config.file=/etc/loki/loki-config.yaml -config.expand-env=true
          # Nazwa `alertmanager` jest wymagana: ruler Lokiego wysyła alerty pod
          # `http://alertmanager:9093` (tak samo jak na produkcji).
          docker run -d --name alertmanager --network walidacja -p 127.0.0.1:9093:9093 \
            -v "$PWD/config/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.34.1 \
            --config.file=/etc/alertmanager/alertmanager.yml --storage.path=/alertmanager
          echo "czekam na gotowość…"
          for i in $(seq 1 30); do
            p=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9090/-/healthy || true)
            l=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/metrics || true)
            a=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9093/-/ready || true)
            echo "  próba $i: prometheus=$p loki=$l alertmanager=$a"
            [ "$p" = "200" ] && [ "$l" = "200" ] && [ "$a" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::Prometheus, Loki lub Alertmanager nie wstały na czas"; exit 1

      - name: Każde zapytanie z dashboardów musi się parsować
        env:
          PROMETHEUS_URL: http://127.0.0.1:9090
          LOKI_URL: http://127.0.0.1:3100
        run: python3 scripts/ci/check_dashboard_queries.py

      - name: Ruler musi wczytać wszystkie reguły (nie tylko mieć je w plikach)
        env:
          LOKI_URL: http://127.0.0.1:3100
        run: |
          echo "czekam, aż ruler wczyta reguły…"
          for i in $(seq 1 24); do
            if python3 scripts/ci/check_ruler_loaded.py; then exit 0; fi
            echo "  próba $i — jeszcze nie wszystkie, czekam 5 s"
            sleep 5
          done
          echo "::error::ruler nie wczytał wszystkich reguł — patrz logi Loki (parse error / unable to list rules)"
          exit 1

      - name: Każda gałąź regexu logowego musi złapać swoją linię
        env:
          LOKI_URL: http://127.0.0.1:3100
        run: python3 tests/integration/verify_log_patterns.py

      - name: Wstrzyknięty log musi dojść jako alert do Alertmanagera
        env:
          LOKI_URL: http://127.0.0.1:3100
          ALERTMANAGER_URL: http://127.0.0.1:9093
        run: python3 tests/integration/verify_log_rules.py --czekaj 150 --pomin-dlugie

      - name: Sprzątanie
        if: always()
        run: docker rm -f walidacja-prometheus walidacja-loki alertmanager || true

  python:
    name: Serwisy Pythona (testy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Składnia skryptów bash
        run: |
          zle=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error::$f ma błąd składni"; zle=1; }
          done
          [ "$zle" -eq 0 ] && echo "  ✓ wszystkie skrypty bash mają poprawną składnię"

      - name: Kompilacja i testy
        run: |
          python3 -m compileall -q services scripts
          python3 -m unittest discover -s tests -v

  panel:
    name: Panel (Astro build)
    needs: zmiany
    if: needs.zmiany.outputs.panel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: panel/pnpm-lock.yaml

      - name: Build
        working-directory: panel
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Logika filtrów/sortowania/hasza panelu — czysta, bez DOM, więc da się ją
      # sprawdzić Node'em (type stripping jest wbudowany od Node 22.6+).
      # Bez tego testu pomyłka w filtrach cicho pokazuje nieprawdziwy stan produkcji.
      - name: Testy logiki panelu (filtry, sortowanie, hasz)
        run: node scripts/ci/check_filtry.mts

      # Geometria wykresów, procenty limitów i trasa `#/wykresy` — pomyłka
      # w nich pokazuje nieprawdziwe zużycie (np. „120% limitu", gdy limit = 0).
      - name: Testy logiki wykresów (zakresy, osie, limity)
        run: node scripts/ci/check_wykresy.mts

      # Logi: selektory LogQL, parsowanie odpowiedzi, filtr podciągiem i trasa
      # `#/logi`. Pomyłka w selektorze pokazuje logi NIE TEJ usługi (etykieta
      # `service` ma prefiks stacka), a pomyłka w filtrze — pustą listę bez powodu.
      - name: Testy logiki logów (zapytania, filtr, trasa)
        run: node scripts/ci/check_logi.mts

      # Obsługa usługi: powód padnięcia zadania, skrót digestu, komendy
      # diagnostyczne. Panel jest tylko do odczytu — test pilnuje, żeby wśród
      # komend nie pojawiła się żadna operacja zmieniająca.
      - name: Testy obsługi usługi (diagnostyka, komendy)
        run: node scripts/ci/check_usluga.mts

      # Motyw wybiera SYSTEM (prefers-color-scheme), więc pomyłka w tokenach
      # jest widoczna dopiero u użytkownika — np. ciemny prostokąt na jasnym
      # tle albo znikający tekst. Ten test pilnuje niezmienników obu motywów.
      - name: Testy motywu (jasny/ciemny, tokeny, brak kolorów na sztywno)
        run: node scripts/ci/check_motyw.mts

      # Zwijanie grup (wzorzec MatExpansionPanel) trzyma stan w localStorage,
      # więc błąd w parsowaniu zapisu albo w polityce domyślnych stanów potrafi
      # ukryć to, co się psuje, albo skasować ustawienia użytkownika.
      - name: Testy zwijania grup (klucze, zapis, stan zbiorczy)
        run: node scripts/ci/check_zwijanie.mts

      - name: Kontrola artefaktu
        run: test -f panel/dist/index.html
