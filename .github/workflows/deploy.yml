name: Deploy to Portainer

on:
  workflow_run:
    workflows: ["Build Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Wywołanie webhooka Portainera
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdzenie sekretu
        id: check
        run: |
          if [ -z "${{ secrets.PORTAINER_MONITORING_WEBHOOK }}" ]; then
            echo "::warning::Brak sekretu PORTAINER_MONITORING_WEBHOOK — pomijam wdrożenie. Dodaj go w Settings → Secrets and variables → Actions, aby włączyć automatyczny redeploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wywołanie webhooka (pull + redeploy stacku)
        id: hook
        if: steps.check.outputs.ready == 'true'
        run: |
          code=$(curl -s -o /tmp/hook.out -w '%{http_code}' --max-time 180 \
            -X POST "${{ secrets.PORTAINER_MONITORING_WEBHOOK }}")
          echo "HTTP $code"
          head -c 500 /tmp/hook.out || true
          if [ "$code" = "200" ] || [ "$code" = "204" ]; then
            exit 0
          fi

          if grep -q "Unable to find the stack by webhook ID" /tmp/hook.out 2>/dev/null; then
            echo "::error::Portainer nie zna tego webhooka — stack \`monitoring\` nie istnieje albo webhook jest nieaktualny."
            echo "Co zrobić:"
            echo "  1. Portainer → Stacks → Add stack → nazwa: monitoring → Repository (Git)"
            echo "     URL: https://github.com/subscribe-it/vps-monitoring, branch main, compose: docker-compose.yml"
            echo "     + wklej komplet zmiennych z env.portainer.example i kliknij Deploy."
            echo "  2. Portainer → stack monitoring → Webhooks → Add webhook → skopiuj URL."
            echo "  3. GitHub → Settings → Secrets and variables → Actions →"
            echo "     zaktualizuj PORTAINER_MONITORING_WEBHOOK na nowy URL."
            exit 1
          fi

          echo "❌ Webhook nie przyjął wdrożenia (HTTP $code)"
          exit 1

      - name: Smoke test łańcucha publicznego (oczekujemy 401 = usługa żyje, wymaga logowania)
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://monitoring.subscribeit.pl/ || true)
            echo "próba $i: HTTP $code"
            [ "$code" = "401" ] && { echo "✅ stack odpowiada za ForwardAuth"; exit 0; }
            sleep 15
          done
          echo "❌ Po 6 minutach brak oczekiwanej odpowiedzi 401"
          exit 1

      - name: Powiadomienie o niepowodzeniu
        if: failure() && steps.check.outputs.ready == 'true'
        run: |
          if [ -n "${{ secrets.NOTIFIER_TOKEN }}" ]; then
            curl -s --max-time 15 -X POST "https://monitoring.subscribeit.pl/status/alert" \
              -H "Content-Type: application/json" \
              -H "X-Auth-Token: ${{ secrets.NOTIFIER_TOKEN }}" \
              -d '{"title":"Nieudany deploy monitoringu","severity":"warning","message":"Workflow Deploy to Portainer zakończył się błędem. Sprawdź Actions → Deploy.","url":"https://github.com/subscribe-it/vps-monitoring/actions"}' \
              || true
          fi
