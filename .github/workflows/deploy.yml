name: Deploy VPS Monitoring Stack

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'config/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'config/**'

env:
  STACK_NAME: monitoring

jobs:
  validate:
    name: Validate Stack Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: |
          echo "🔍 Validating docker-compose.yml syntax..."
          
          # Check if docker-compose.yml exists
          if [ ! -f "docker-compose.yml" ]; then
            echo "❌ docker-compose.yml not found!"
            exit 1
          fi
          
          # Validate YAML syntax using Python
          python3 -c "
          import yaml
          import sys
          
          try:
              with open('docker-compose.yml', 'r') as f:
                  yaml.safe_load(f)
              print('✅ docker-compose.yml syntax is valid')
          except yaml.YAMLError as e:
              print(f'❌ YAML syntax error: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Error reading file: {e}')
              sys.exit(1)
          " || {
            echo "⚠️  Python YAML validation failed, trying alternative method..."
            # Alternative: use docker-compose config (if available)
            docker compose config --quiet 2>&1 || {
              echo "❌ docker-compose.yml validation failed!"
              exit 1
            }
          }

      - name: Check required files
        run: |
          echo "🔍 Checking required configuration files..."
          
          REQUIRED_FILES=(
            "config/prometheus/prometheus.yml"
            "config/loki/loki-config.yaml"
            "config/promtail/promtail-config.yaml"
            "config/grafana/provisioning/datasources/datasources.yml"
            "config/grafana/provisioning/dashboards/dashboards.yml"
          )
          
          MISSING_FILES=()
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              MISSING_FILES+=("$file")
            fi
          done
          
          if [ ${#MISSING_FILES[@]} -gt 0 ]; then
            echo "❌ Missing required files:"
            printf '  - %s\n' "${MISSING_FILES[@]}"
            exit 1
          fi
          
          echo "✅ All required configuration files present"

      - name: Validate Prometheus config
        run: |
          echo "🔍 Validating Prometheus configuration..."
          python3 -c "
          import yaml
          import sys
          
          try:
              with open('config/prometheus/prometheus.yml', 'r') as f:
                  config = yaml.safe_load(f)
              
              # Check required sections
              required = ['global', 'scrape_configs']
              for section in required:
                  if section not in config:
                      print(f'❌ Missing required section: {section}')
                      sys.exit(1)
              
              print('✅ Prometheus configuration is valid')
          except Exception as e:
              print(f'❌ Error validating Prometheus config: {e}')
              sys.exit(1)
          "

      - name: Validate Loki config
        run: |
          echo "🔍 Validating Loki configuration..."
          python3 -c "
          import yaml
          import sys
          
          try:
              with open('config/loki/loki-config.yaml', 'r') as f:
                  yaml.safe_load(f)
              print('✅ Loki configuration is valid')
          except Exception as e:
              print(f'❌ Error validating Loki config: {e}')
              sys.exit(1)
          "

      - name: Validate Grafana datasources
        run: |
          echo "🔍 Validating Grafana datasources configuration..."
          python3 -c "
          import yaml
          import sys
          
          try:
              with open('config/grafana/provisioning/datasources/datasources.yml', 'r') as f:
                  config = yaml.safe_load(f)
              
              if 'datasources' not in config:
                  print('❌ Missing datasources section')
                  sys.exit(1)
              
              print('✅ Grafana datasources configuration is valid')
          except Exception as e:
              print(f'❌ Error validating Grafana datasources: {e}')
              sys.exit(1)
          "

      - name: Validation Summary
        if: always()
        run: |
          echo "✅ Stack validation completed"
          echo "📋 All configuration files are valid"

  deploy:
    name: Deploy to Portainer
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Portainer Webhook
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_MONITORING_WEBHOOK }}
        run: |
          echo "🚀 Triggering Portainer webhook for monitoring stack deployment..."
          
          if [ -z "$PORTAINER_WEBHOOK_URL" ]; then
            echo "⚠️  PORTAINER_MONITORING_WEBHOOK secret not configured"
            echo "ℹ️  Skipping deployment webhook"
            echo "ℹ️  To enable automatic deployment, add PORTAINER_MONITORING_WEBHOOK secret"
            exit 0
          fi
          
          echo "📡 Calling Portainer webhook..."
          curl -X POST -f -s -w "\nHTTP Status: %{http_code}\n" \
            "$PORTAINER_WEBHOOK_URL" || {
            echo "⚠️  Webhook failed but workflow continues"
            echo "ℹ️  You may need to manually update the stack in Portainer"
            exit 0  # Non-blocking - don't fail the workflow
          }
          
          echo "✅ Portainer webhook triggered successfully"
          echo "📦 Stack should be updating in Portainer..."

      - name: Deployment Summary
        if: always()
        run: |
          echo "🚀 Deployment workflow completed"
          echo ""
          echo "📋 Summary:"
          echo "  - Stack: ${{ env.STACK_NAME }}"
          echo "  - Branch: ${{ github.ref_name }}"
          echo "  - Commit: ${{ github.sha }}"
          echo ""
          if [ -n "${{ secrets.PORTAINER_MONITORING_WEBHOOK }}" ]; then
            echo "✅ Webhook triggered - Portainer should update the stack automatically"
          else
            echo "⚠️  Webhook not configured - manual deployment required"
            echo "   1. Go to Portainer"
            echo "   2. Navigate to Stacks"
            echo "   3. Select '${{ env.STACK_NAME }}' stack"
            echo "   4. Click 'Editor' tab"
            echo "   5. Update stack with latest docker-compose.yml"
            echo "   6. Click 'Update the stack'"
          fi


