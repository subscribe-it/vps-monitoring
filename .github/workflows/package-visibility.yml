# Ustawia widoczność pakietów w ghcr.io (domyślnie: publiczne).
#
# Po co: stack w Portainerze pobiera obrazy z ghcr.io. Dopóki pakiety są
# prywatne, anonimowy pull kończy się odmową i wdrożenie stoi. Publiczne
# pakiety = zero konfiguracji rejestru po stronie Portainera.
#
# W obrazach nie ma sekretów — wszystko wrażliwe idzie zmiennymi środowiskowymi
# w czasie działania, a obrazy powstają z tego samego (publicznego) repo.
#
# Uruchamiane wyłącznie ręcznie (workflow_dispatch) — nic nie dzieje się samo.
name: Package visibility

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: "Docelowa widoczność pakietów"
        required: true
        default: public
        type: choice
        options: [public, private]

permissions:
  packages: write
  contents: read

jobs:
  visibility:
    name: Widoczność pakietów (${{ inputs.visibility }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gdy PATCH zwraca 404, trzeba wiedzieć DLACZEGO: zły typ tokenu, brak
      # zakresu, brak roli w organizacji czy pakiet pod innym właścicielem.
      # Ten krok nic nie zmienia — tylko odpowiada na te pytania.
      - name: Diagnoza tokenu i pakietów
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # GitHub uruchamia kroki jako `bash -e`, więc KAŻDA niezerowa komenda
          # przerywa krok (i pomija następne). Diagnostyka ma się nie wywalać.
          set +e +o pipefail -u
          ORG="${{ github.repository_owner }}"

          # Kod HTTP bez wywoływania SIGPIPE (poprzednia wersja używała `gh api -i | head`,
          # co kończyło krok kodem 141 i POMIJAŁO kolejne kroki — dlatego nic nie działało).
          kod_http() {
            lokalne=$(gh api -i "$1" 2>/dev/null || true)
            printf '%s' "$lokalne" | sed -n '1s/.* \([0-9][0-9][0-9]\) .*/\1/p'
          }
          cialo() {
            lokalne=$(gh api "$1" 2>&1 || true)
            echo "${lokalne:0:400}"
          }

          if [ -n "${{ secrets.GHCR_ADMIN_TOKEN }}" ]; then
            echo "Sekret GHCR_ADMIN_TOKEN: ustawiony"
          else
            echo "::warning::Brak sekretu GHCR_ADMIN_TOKEN — używam tokenu Actions"
          fi

          echo "--- właściciel tokenu ---"
          gh api /user --jq '"  login: \(.login), typ: \(.type)"' 2>/dev/null || echo "  ✗ nie odczytam /user"

          echo "--- typ tokenu i zakresy ---"
          zakresy=$(gh api -i /user 2>/dev/null | grep -i '^x-oauth-scopes:' || true)
          if [ -n "$zakresy" ]; then
            echo "  klasyczny PAT, zakresy:${zakresy#*:}"
          else
            echo "  token fine-grained (brak nagłówka X-Oauth-Scopes)"
          fi

          echo "--- co widzi token ---"
          echo "  LISTA /orgs/$ORG/packages       → HTTP $(kod_http "/orgs/$ORG/packages?package_type=container")"
          echo "  LISTA /user/packages             → HTTP $(kod_http "/user/packages?package_type=container")"
          echo "  PAKIET /orgs/…/vps-monitoring-loki  → HTTP $(kod_http "/orgs/$ORG/packages/container/vps-monitoring-loki")"
          echo "  PAKIET /user/…/vps-monitoring-loki  → HTTP $(kod_http "/user/packages/container/vps-monitoring-loki")"

          echo "--- nazwy widziane przez /orgs/…/packages (pierwsze 15) ---"
          nazwy=$(gh api "/orgs/$ORG/packages?package_type=container" --jq '.[].name' 2>/dev/null || true)
          if [ -n "$nazwy" ]; then echo "$nazwy" | sed -n '1,15p'; else echo "  (brak dostępu)"; fi

          echo "--- treść odpowiedzi z listy organizacji ---"
          cialo "/orgs/$ORG/packages?package_type=container"
          echo
          exit 0

      - name: Sonda — dlaczego PATCH zwraca 404 (surowa odpowiedź)
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
          TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN }}
        run: |
          set +e +o pipefail -u
          ORG="${{ github.repository_owner }}"
          PAK="vps-monitoring-loki"
          echo "=== A) gh api --method PATCH -f visibility=public ==="
          a=$(gh api -i --method PATCH "/orgs/$ORG/packages/container/$PAK" -f visibility=public 2>&1 || true)
          echo "$a" | sed -n '1,20p'
          echo
          echo "=== B) curl: PATCH z ciałem JSON ==="
          if [ -n "$TOKEN" ]; then
            curl -sS -i -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"visibility":"public"}' \
              "https://api.github.com/orgs/$ORG/packages/container/$PAK" > /tmp/curl.out 2>&1 || true
            sed -n '1,25p' /tmp/curl.out
          else
            echo "  (brak GHCR_ADMIN_TOKEN — pomijam)"
          fi
          echo
          echo "=== C) kontrolnie GET tym samym tokenem (curl) ==="
          if [ -n "$TOKEN" ]; then
            curl -sS -o /dev/null -w '  GET /orgs/%{url_effective} → HTTP %{http_code}\n' \
              -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/$ORG/packages/container/$PAK"
          fi
          exit 0

      - name: Ustaw widoczność pakietów
        env:
          GH_TOKEN: ${{ secrets.GHCR_ADMIN_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e +o pipefail -u
          ORG="${{ github.repository_owner }}"
          VIS="${{ inputs.visibility }}"
          # Kod HTTP z przechwyconej odpowiedzi — bez `gh | head`, które kończy
          # się SIGPIPE i (przy `bash -e` od GitHuba) przerywa cały krok.
          kod_http() {
            lokalne=$(gh api -i "$1" 2>/dev/null || true)
            printf '%s' "$lokalne" | sed -n '1s/.* \([0-9][0-9][0-9]\) .*/\1/p'
          }
          # Nazwy bierzemy z compose — lista nie może się rozjechać z tym, co wdrażamy.
          pakiety=$(grep -oE "ghcr\.io/$ORG/[a-z0-9-]+" docker-compose.yml | sed "s|ghcr.io/$ORG/||" | sort -u)
          ile=$(echo "$pakiety" | wc -l)
          echo "Organizacja: $ORG | widoczność: $VIS | pakietów: $ile"

          # Pakiety mogą należeć do organizacji albo do użytkownika. Wybieramy bazę,
          # która faktycznie je widzi (200), zamiast zakładać jedną z nich.
          dziala=""
          for baza in "/orgs/$ORG/packages/container" "/user/packages/container"; do
            pierwsz=$(echo "$pakiety" | sed -n '1p')
            if [ "$(kod_http "$baza/$pierwsz")" = "200" ]; then dziala="$baza"; break; fi
          done
          if [ -z "$dziala" ]; then
            echo "::error::Token nie widzi pakietów (żadna baza nie zwróciła 200) — zobacz krok „Diagnoza tokenu i pakietów”."
            echo "Droga przez UI: GitHub → organizacja $ORG → Packages → pakiet → Package settings → Danger Zone → Change visibility → $VIS"
            exit 1
          fi
          echo "Pakiety znalezione pod: $dziala"

          udane=0
          for nazwa in $pakiety; do
            blad=$(gh api --method PATCH "$dziala/$nazwa" -f "visibility=$VIS" --jq '.visibility' 2>&1)
            if [ $? -eq 0 ] && [ -n "$blad" ]; then
              echo "  ✓ $nazwa → $blad"
              udane=$((udane + 1))
            else
              echo "  ✗ $nazwa → $(echo "$blad" | sed -n '1,2p' | tr '\n' ' ')"
            fi
          done
          echo "Ustawiono: $udane z $ile"
          if [ "$udane" -eq 0 ]; then
            echo "::error::Token nie może zmieniać widoczności pakietów — szczegóły w kroku „Diagnoza”."
            exit 1
          fi

      - name: Czy anonimowy pull działa (Portainer bez danych logowania)
        env:
          ORG: ${{ github.repository_owner }}
          VIS: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          # Rozstrzygające pytanie do rejestru: czy wyda token anonimowemu klientowi?
          #   "authentication required" = pakiet istnieje, ale jest prywatny
          #   "DENIED"                  = pakietu nie ma (albo brak dostępu)
          #   token wydany              = pakiet publiczny, pull zadziała
          zle=0
          for nazwa in $(grep -oE "ghcr\.io/$ORG/[a-z0-9-]+" docker-compose.yml | sed "s|ghcr.io/$ORG/||" | sort -u); do
            odp=$(curl -s "https://ghcr.io/token?scope=repository:$ORG/$nazwa:pull&service=ghcr.io")
            token=$(echo "$odp" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))' 2>/dev/null || true)
            if [ -n "$token" ]; then
              kod=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
                -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
                "https://ghcr.io/v2/$ORG/$nazwa/manifests/latest")
              echo "  ✓ $nazwa: publiczny, manifest → HTTP $kod"
            else
              powod=${odp:0:80}
              echo "  ✗ $nazwa: anonimowo niedostępny ($powod)"
              zle=$((zle + 1))
            fi
          done
          if [ "$VIS" = "public" ] && [ "$zle" -gt 0 ]; then
            echo "::error::$zle pakietów nie jest publicznych — Portainer nie pobierze obrazów bez danych logowania."
            exit 1
          fi
