# Ustawia widoczność pakietów w ghcr.io (domyślnie: publiczne).
#
# Po co: stack w Portainerze pobiera obrazy z ghcr.io. Dopóki pakiety są
# prywatne, anonimowy pull kończy się HTTP 403 i wdrożenie stoi. Publiczne
# pakiety = zero konfiguracji rejestru po stronie Portainera.
#
# W obrazach nie ma żadnych sekretów (wszystko wrażliwe idzie zmiennymi
# środowiskowymi w czasie działania) — to ten sam kod, co w publicznym repo.
#
# Uruchamiane wyłącznie ręcznie (workflow_dispatch) — nic nie dzieje się samo.
name: Package visibility

on:
  workflow_dispatch:
    inputs:
      visibility:
        description: "Docelowa widoczność pakietów"
        required: true
        default: public
        type: choice
        options: [public, private]

permissions:
  packages: write
  contents: read

jobs:
  visibility:
    name: Widoczność pakietów (${{ inputs.visibility }})
    runs-on: ubuntu-latest
    steps:
      - name: Ustaw widoczność wszystkich pakietów kontenerów
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
          VIS: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          echo "Organizacja: $ORG | docelowa widoczność: $VIS"
          if ! pakiety=$(gh api "/orgs/$ORG/packages?package_type=container" --jq '.[].name' 2>/tmp/blad); then
            echo "::warning::Nie udało się wylistować pakietów: $(cat /tmp/blad)"
            echo "Ustaw widoczność ręcznie: GitHub → organizacja $ORG → Packages → wybierz pakiet → Package settings → Danger Zone → Change visibility."
            exit 0
          fi
          ile=0
          for nazwa in $pakiety; do
            wynik=$(gh api --method PATCH "/orgs/$ORG/packages/container/$nazwa" -f "visibility=$VIS" --jq '.visibility' 2>/tmp/blad) \
              && { echo "  ✓ $nazwa → $wynik"; ile=$((ile+1)); } \
              || echo "  ✗ $nazwa → $(cat /tmp/blad | head -1)"
          done
          echo "Ustawiono: $ile pakietów na $VIS"
          if [ "$ile" -eq 0 ]; then
            echo "::warning::Żaden pakiet nie został zmieniony — sprawdź uprawnienia (wymagane packages: write) albo ustaw widoczność w UI."
          fi

      - name: Sprawdź anonimowy pull (czy Portainer pobierze bez danych logowania)
        env:
          ORG: ${{ github.repository_owner }}
          VIS: ${{ inputs.visibility }}
        run: |
          set -euo pipefail
          obraz="monitoring-loki"
          token=$(curl -s "https://ghcr.io/token?scope=repository:$ORG/$obraz:pull&service=ghcr.io" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("token",""))')
          kod=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://ghcr.io/v2/$ORG/$obraz/manifests/latest")
          echo "Anonimowy pull $ORG/$obraz:latest → HTTP $kod"
          if [ "$VIS" = "public" ] && [ "$kod" != "200" ]; then
            echo "::error::Pakiety nadal nie są publiczne (HTTP $kod) — Portainer nie pobierze obrazów bez danych logowania."
            exit 1
          fi
