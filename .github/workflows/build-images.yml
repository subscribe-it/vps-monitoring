name: Build Images

on:
  push:
    branches: [main]
    paths:
      - 'docker-compose.yml'
      - 'config/**'
      - 'dockerfiles/**'
      - 'services/**'
      - 'panel/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: prometheus,   dockerfile: dockerfiles/prometheus/Dockerfile,   context: . }
          - { name: alertmanager, dockerfile: dockerfiles/alertmanager/Dockerfile, context: . }
          - { name: loki,         dockerfile: dockerfiles/loki/Dockerfile,         context: . }
          - { name: promtail,     dockerfile: dockerfiles/promtail/Dockerfile,     context: . }
          - { name: grafana,      dockerfile: dockerfiles/grafana/Dockerfile,      context: . }
          - { name: auth,         dockerfile: dockerfiles/auth/Dockerfile,         context: . }
          # te obrazy mają własny kontekst (kopiują tylko swój katalog),
          # ale `file` w buildx jest liczony od katalogu repo, nie od kontekstu
          - { name: discovery,    dockerfile: services/discovery/Dockerfile,       context: services/discovery }
          - { name: notifier,     dockerfile: services/notifier/Dockerfile,        context: services/notifier }
          - { name: health-ping,  dockerfile: services/health-ping/Dockerfile,     context: services/health-ping }
          - { name: panel,        dockerfile: panel/Dockerfile,                    context: panel }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Logowanie do ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Budowa i wysyłka
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/subscribe-it/vps-monitoring-${{ matrix.name }}:main
            ghcr.io/subscribe-it/vps-monitoring-${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: false
