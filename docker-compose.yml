version: '3.8'

networks:
  monitoring:
    driver: overlay
    attachable: true
  traefik-public:
    external: true

volumes:
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  uptime_kuma_data: {}
  duplicati_data: {}
  duplicati_backups: {}
  alertmanager_data: {}

configs:
  prometheus_config:
    external: true
  prometheus_alerts_system:
    external: true
  prometheus_alerts_http:
    external: true
  prometheus_alerts_mariadb:
    external: true
  prometheus_alerts_monitoring:
    external: true
  prometheus_alerts_prometheus:
    external: true
  loki_config:
    external: true
  promtail_config:
    external: true
  alertmanager_config:
    external: true
  blackbox_config:
    external: true
  grafana_datasources:
    external: true
  grafana_dashboards:
    external: true
  telegram_webhook_script:
    external: true
  telegram_webhook_requirements:
    external: true
  dashboard_automation_script:
    external: true
  dashboard_template_wordpress:
    external: true
  dashboard_template_generic_app:
    external: true
  dashboard_template_database:
    external: true
  uptime_kuma_config:
    external: true
  uptime_kuma_init_script_v2:
    file: ./scripts/uptime-kuma-init.py

services:

  # ============================================================
  # NODE EXPORTER - Host system metrics (CPU, RAM, Disk, Network)
  # ============================================================
  node-exporter:
    image: prom/node-exporter:latest
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$$'
      - '--no-collector.wifi'
      - '--no-collector.hwmon'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
        mode: host

  # ============================================================
  # CADVISOR - ALL Docker containers metrics (OOTB, no labels needed)
  # Scrapes every running container automatically
  # ============================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    hostname: '{{.Node.Hostname}}-cadvisor'
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    command:
      - --docker_only=false
      - --housekeeping_interval=15s
      - --max_housekeeping_interval=30s
      - --event_storage_event_limit=default=0
      - --event_storage_age_limit=default=0
      - --disable_metrics=percpu,sched,hugetlb
      - --store_container_labels=true
      - --whitelisted_container_labels=com.docker.swarm.service.name,com.docker.stack.namespace,com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - monitoring
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: host

  # ============================================================
  # MARIADB EXPORTER - jpolski stack
  # Requires DATA_SOURCE_NAME env var with MariaDB credentials
  # ============================================================
  mariadb-exporter-jpolski:
    image: prom/mysqld-exporter:latest
    hostname: mariadb-exporter-jpolski
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    command:
      - '--collect.info_schema.innodb_metrics'
      - '--collect.info_schema.processlist'
      - '--collect.perf_schema.eventsstatements'
      - '--collect.perf_schema.eventsstatementssum'
      - '--collect.perf_schema.file_instances'
      - '--collect.global_status'
      - '--collect.global_variables'
      - '--collect.slave_status'
    environment:
      # Format: user:password@tcp(host:port)/
      # Set in Portainer stack env vars: JPOLSKI_MARIADB_DSN
      - DATA_SOURCE_NAME=${JPOLSKI_MARIADB_DSN:-exporter:password@tcp(jpolski_na6_pl_prod_mariadb.1:3306)/}
    networks:
      - monitoring
    ports:
      - "9104:9104"

  # ============================================================
  # MARIADB EXPORTER - kosmetix stack
  # ============================================================
  mariadb-exporter-kosmetix:
    image: prom/mysqld-exporter:latest
    hostname: mariadb-exporter-kosmetix
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 10s
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.05'
          memory: 16M
    command:
      - '--collect.info_schema.innodb_metrics'
      - '--collect.info_schema.processlist'
      - '--collect.global_status'
      - '--collect.global_variables'
    environment:
      - DATA_SOURCE_NAME=${KOSMETIX_MARIADB_DSN:-exporter:password@tcp(kosmetix-staging_mariadb.1:3306)/}
    networks:
      - monitoring
    ports:
      - "9105:9104"

  # ============================================================
  # PROMETHEUS - Metrics storage & alerting engine
  # ============================================================
  prometheus:
    image: prom/prometheus:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts_system
        target: /etc/prometheus/alerts/system.yml
      - source: prometheus_alerts_http
        target: /etc/prometheus/alerts/http.yml
      - source: prometheus_alerts_mariadb
        target: /etc/prometheus/alerts/mariadb.yml
      - source: prometheus_alerts_monitoring
        target: /etc/prometheus/alerts/monitoring.yml
      - source: prometheus_alerts_prometheus
        target: /etc/prometheus/alerts/prometheus.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-720h}'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - traefik-public
    depends_on:
      - node-exporter
      - cadvisor
      - alertmanager
      - blackbox-exporter
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.rule=Host(`${MONITORING_HOST}`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.middlewares=prometheus-stripprefix"
      - "traefik.http.middlewares.prometheus-stripprefix.stripprefix.prefixes=/prometheus"

  # ============================================================
  # LOKI - Log aggregation
  # ============================================================
  loki:
    image: grafana/loki:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    ports:
      - "3100:3100"
    networks:
      - monitoring
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "traefik.http.routers.loki.rule=Host(`${MONITORING_HOST}`) && PathPrefix(`/loki`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.middlewares=loki-stripprefix"
      - "traefik.http.middlewares.loki-stripprefix.stripprefix.prefixes=/loki"

  # ============================================================
  # PROMTAIL - Log collector from ALL Docker containers (OOTB)
  # ============================================================
  promtail:
    image: grafana/promtail:latest
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  # ============================================================
  # GRAFANA - Visualization & dashboards
  # ============================================================
  grafana:
    image: grafana/grafana:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://${MONITORING_HOST}/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_ALERTING_ENABLED=false
      - GF_UNIFIED_ALERTING_ENABLED=true
    ports:
      - "3000:3000"
    networks:
      - monitoring
      - traefik-public
    depends_on:
      - prometheus
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.rule=Host(`${MONITORING_HOST}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.middlewares=grafana-stripprefix"
      - "traefik.http.middlewares.grafana-stripprefix.stripprefix.prefixes=/grafana"

  # ============================================================
  # UPTIME KUMA - Service uptime monitoring
  # ============================================================
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    hostname: uptime-kuma
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"
    networks:
      - monitoring
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
      - "traefik.http.routers.uptime-kuma.rule=Host(`${MONITORING_HOST}`) && PathPrefix(`/uptime-kuma`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.middlewares=uptime-kuma-stripprefix"
      - "traefik.http.middlewares.uptime-kuma-stripprefix.stripprefix.prefixes=/uptime-kuma"

  # ============================================================
  # DUPLICATI - Backup of monitoring data
  # ============================================================
  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    hostname: duplicati
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    volumes:
      - duplicati_data:/config
      - duplicati_backups:/backups
      - prometheus_data:/source/prometheus:ro
      - grafana_data:/source/grafana:ro
      - loki_data:/source/loki:ro
      - uptime_kuma_data:/source/uptime-kuma:ro
      - alertmanager_data:/source/alertmanager:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - "8200:8200"
    networks:
      - monitoring
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.duplicati.loadbalancer.server.port=8200"
      - "traefik.http.routers.duplicati.rule=Host(`${MONITORING_HOST}`) && PathPrefix(`/duplicati`)"
      - "traefik.http.routers.duplicati.entrypoints=websecure"
      - "traefik.http.routers.duplicati.middlewares=duplicati-stripprefix"
      - "traefik.http.middlewares.duplicati-stripprefix.stripprefix.prefixes=/duplicati"

  # ============================================================
  # ALERTMANAGER - Alert routing to Telegram
  # ============================================================
  alertmanager:
    image: prom/alertmanager:latest
    hostname: alertmanager
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=https://${MONITORING_HOST}/alertmanager'
      - '--cluster.advertise-address=0.0.0.0:9093'
    ports:
      - "9093:9093"
    networks:
      - monitoring
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
      - "traefik.http.routers.alertmanager.rule=Host(`${MONITORING_HOST}`) && PathPrefix(`/alertmanager`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.middlewares=alertmanager-stripprefix"
      - "traefik.http.middlewares.alertmanager-stripprefix.stripprefix.prefixes=/alertmanager"

  # ============================================================
  # BLACKBOX EXPORTER - HTTP/TCP probing
  # ============================================================
  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    hostname: blackbox-exporter
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    configs:
      - source: blackbox_config
        target: /etc/blackbox_exporter/config.yml
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    ports:
      - "9115:9115"
    networks:
      - monitoring

  # ============================================================
  # TELEGRAM WEBHOOK - Alert notifications
  # ============================================================
  telegram-webhook:
    image: ghcr.io/subscribe-it/vps-monitoring-telegram-webhook:latest
    hostname: telegram-webhook
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    configs:
      - source: telegram_webhook_script
        target: /app/telegram-webhook.py
      - source: telegram_webhook_requirements
        target: /app/requirements.txt
    working_dir: /app
    command: sh -c "pip install -q -r requirements.txt && python3 telegram-webhook.py"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PORT=8088
    ports:
      - "8088:8088"
    networks:
      - monitoring
    depends_on:
      - alertmanager

  # ============================================================
  # DASHBOARD AUTOMATION - Auto-create Grafana dashboards
  # ============================================================
  dashboard-automation:
    image: ghcr.io/subscribe-it/vps-monitoring-dashboard-automation:latest
    hostname: dashboard-automation
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dashboard-automation.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    configs:
      - source: dashboard_automation_script
        target: /app/dashboard-automation.py
      - source: dashboard_template_wordpress
        target: /app/templates/wordpress.json
      - source: dashboard_template_generic_app
        target: /app/templates/generic-app.json
      - source: dashboard_template_database
        target: /app/templates/database.json
    working_dir: /app
    command: python3 dashboard-automation.py
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-60}
    networks:
      - monitoring
    depends_on:
      - grafana
      - prometheus

  # ============================================================
  # UPTIME KUMA INIT - Auto-configure monitors from YAML
  # ============================================================
  uptime-kuma-init:
    image: ghcr.io/subscribe-it/vps-monitoring-uptime-kuma-init:latest
    hostname: uptime-kuma-init
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: none
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    configs:
      - source: uptime_kuma_config
        target: /app/config/uptime-kuma-config.yaml
      - source: uptime_kuma_init_script_v2
        target: /app/uptime-kuma-init.py
      - source: telegram_webhook_requirements
        target: /app/requirements.txt
    working_dir: /app
    command: sh -c "pip install -q -r requirements.txt && python3 uptime-kuma-init.py"
    environment:
      - UPTIME_KUMA_URL=http://uptime-kuma:3001
      - UPTIME_KUMA_USERNAME=${UPTIME_KUMA_USERNAME:-admin}
      - UPTIME_KUMA_PASSWORD=${UPTIME_KUMA_PASSWORD:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    networks:
      - monitoring
    depends_on:
      - uptime-kuma

  # ============================================================
  # WORDPRESS STACK DISCOVERY - Auto-discover WordPress stacks
  # ============================================================
  wordpress-stack-discovery:
    image: ghcr.io/subscribe-it/vps-monitoring-wordpress-stack-discovery:latest
    hostname: wordpress-stack-discovery
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    configs:
      - source: dashboard_template_wordpress
        target: /app/templates/wordpress.json
      - source: dashboard_template_generic_app
        target: /app/templates/generic-app.json
      - source: dashboard_template_database
        target: /app/templates/database.json
    environment:
      - UPTIME_KUMA_URL=http://uptime-kuma:3001
      - UPTIME_KUMA_USERNAME=${UPTIME_KUMA_USERNAME:-admin}
      - UPTIME_KUMA_PASSWORD=${UPTIME_KUMA_PASSWORD:-}
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - CHECK_INTERVAL=300
