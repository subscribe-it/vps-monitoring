version: '3.8'

networks:
  monitoring:
    driver: overlay
    attachable: true
  traefik-public:
    external: true  # Istniejąca sieć Traefik

volumes:
  prometheus_data: {}
  grafana_data: {}
  loki_data: {}
  uptime_kuma_data: {}
  duplicati_data: {}
  duplicati_backups: {}
  alertmanager_data: {}

# Docker Swarm Configs - pliki konfiguracyjne (muszą być utworzone przed deployem)
# Zobacz: docs/DEPLOYMENT.md - sekcja "Creating Docker Configs"
configs:
  prometheus_config:
    external: true
  prometheus_alerts_system:
    external: true
  prometheus_alerts_http:
    external: true
  prometheus_alerts_monitoring:
    external: true
  prometheus_alerts_prometheus:
    external: true
  loki_config:
    external: true
  promtail_config:
    external: true
  alertmanager_config:
    external: true
  blackbox_config:
    external: true
  grafana_datasources:
    external: true
  grafana_dashboards:
    external: true
  telegram_webhook_script:
    external: true
  telegram_webhook_requirements:
    external: true
  dashboard_automation_script:
    external: true

services:
  node-exporter:
    image: prom/node-exporter:latest
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|$$)'  # Escaped $$
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitoring
    ports:
      - target: 9100
        published: 9100
        protocol: tcp
        mode: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    hostname: cadvisor
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --disable_metrics=percpu,sched,tcp,udp,disk,diskIO,hugetlb
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: host

  prometheus:
    image: prom/prometheus:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus_alerts_system
        target: /etc/prometheus/alerts/system.yml
      - source: prometheus_alerts_http
        target: /etc/prometheus/alerts/http.yml
      - source: prometheus_alerts_monitoring
        target: /etc/prometheus/alerts/monitoring.yml
      - source: prometheus_alerts_prometheus
        target: /etc/prometheus/alerts/prometheus.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-720h}'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - traefik-public
    depends_on:
      - node-exporter
      - cadvisor
      - alertmanager
      - blackbox-exporter
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.http.routers.prometheus.rule=Host(`${MONITORING_HOST:-57.129.41.248}`) && PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"
      - "traefik.http.routers.prometheus.middlewares=prometheus-stripprefix"
      - "traefik.http.middlewares.prometheus-stripprefix.stripprefix.prefixes=/prometheus"

  loki:
    image: grafana/loki:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    configs:
      - source: loki_config
        target: /etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - monitoring
      - traefik-public
    depends_on:
      - node-exporter
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "traefik.http.routers.loki.rule=Host(`${MONITORING_HOST:-57.129.41.248}`) && PathPrefix(`/loki`)"
      - "traefik.http.routers.loki.entrypoints=websecure"
      - "traefik.http.routers.loki.middlewares=loki-stripprefix"
      - "traefik.http.middlewares.loki-stripprefix.stripprefix.prefixes=/loki"

  promtail:
    image: grafana/promtail:latest
    deploy:
      mode: global
      restart_policy:
        condition: any
        delay: 5s
    configs:
      - source: promtail_config
        target: /etc/promtail/config.yml
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/localtime:/etc/localtime:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    configs:
      - source: grafana_datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana_dashboards
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
    volumes:
      - grafana_data:/var/lib/grafana
      # Templates directory - opcjonalny bind mount (katalog)
      # Jeśli chcesz użyć templates, odkomentuj poniższą linię i zmień ścieżkę na właściwą lokalizację gdzie Portainer klonuje repo
      # W Portainer: sprawdź ścieżkę w Stack → Editor → gdzie jest docker-compose.yml (zwykle /data/compose/ID/)
      # - /data/compose/25/config/grafana/provisioning/dashboards/templates:/var/lib/grafana/dashboards/templates:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=http://${MONITORING_HOST:-57.129.41.248}:3000
      - GF_INSTALL_PLUGINS=
    ports:
      - "3000:3000"
    networks:
      - monitoring
      - traefik-public
    depends_on:
      - prometheus
      - loki
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.rule=Host(`${MONITORING_HOST:-57.129.41.248}`) && PathPrefix(`/grafana`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.middlewares=grafana-stripprefix"
      - "traefik.http.middlewares.grafana-stripprefix.stripprefix.prefixes=/grafana"

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    hostname: uptime-kuma
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "3001:3001"
    networks:
      - monitoring
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.uptime-kuma.loadbalancer.server.port=3001"
      - "traefik.http.routers.uptime-kuma.rule=Host(`${MONITORING_HOST:-57.129.41.248}`) && PathPrefix(`/uptime-kuma`)"
      - "traefik.http.routers.uptime-kuma.entrypoints=websecure"
      - "traefik.http.routers.uptime-kuma.middlewares=uptime-kuma-stripprefix"
      - "traefik.http.middlewares.uptime-kuma-stripprefix.stripprefix.prefixes=/uptime-kuma"

  duplicati:
    image: lscr.io/linuxserver/duplicati:latest
    hostname: duplicati
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
    volumes:
      - duplicati_data:/config
      - duplicati_backups:/backups
      - prometheus_data:/source/prometheus:ro
      - grafana_data:/source/grafana:ro
      - loki_data:/source/loki:ro
      - uptime_kuma_data:/source/uptime-kuma:ro
      - alertmanager_data:/source/alertmanager:ro
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Warsaw
    ports:
      - "8200:8200"
    networks:
      - monitoring
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.duplicati.loadbalancer.server.port=8200"
      - "traefik.http.routers.duplicati.rule=Host(`${MONITORING_HOST:-57.129.41.248}`) && PathPrefix(`/duplicati`)"
      - "traefik.http.routers.duplicati.entrypoints=websecure"
      - "traefik.http.routers.duplicati.middlewares=duplicati-stripprefix"
      - "traefik.http.middlewares.duplicati-stripprefix.stripprefix.prefixes=/duplicati"

  alertmanager:
    image: prom/alertmanager:latest
    hostname: alertmanager
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
    volumes:
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://${MONITORING_HOST:-57.129.41.248}:9093'
    ports:
      - "9093:9093"
    networks:
      - monitoring
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
      - "traefik.http.routers.alertmanager.rule=Host(`${MONITORING_HOST:-57.129.41.248}`) && PathPrefix(`/alertmanager`)"
      - "traefik.http.routers.alertmanager.entrypoints=websecure"
      - "traefik.http.routers.alertmanager.middlewares=alertmanager-stripprefix"
      - "traefik.http.middlewares.alertmanager-stripprefix.stripprefix.prefixes=/alertmanager"

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    hostname: blackbox-exporter
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
    configs:
      - source: blackbox_config
        target: /etc/blackbox_exporter/config.yml
    command:
      - '--config.file=/etc/blackbox_exporter/config.yml'
    ports:
      - "9115:9115"
    networks:
      - monitoring

  telegram-webhook:
    image: python:3.11-slim
    hostname: telegram-webhook
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.1'
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    configs:
      - source: telegram_webhook_script
        target: /app/telegram-webhook.py
      - source: telegram_webhook_requirements
        target: /app/requirements.txt
    working_dir: /app
    command: sh -c "pip install -q -r requirements.txt && python3 telegram-webhook.py"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - PORT=8088
    ports:
      - "8088:8088"
    networks:
      - monitoring
    depends_on:
      - alertmanager

  dashboard-automation:
    image: python:3.11-slim
    hostname: dashboard-automation
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    healthcheck:
      test: ["CMD", "pgrep", "-f", "dashboard-automation.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    configs:
      - source: dashboard_automation_script
        target: /app/dashboard-automation.py
    volumes:
      # Templates directory - opcjonalny bind mount (katalog)
      # Jeśli chcesz użyć templates, odkomentuj poniższą linię i zmień ścieżkę na właściwą lokalizację gdzie Portainer klonuje repo
      # W Portainer: sprawdź ścieżkę w Stack → Editor → gdzie jest docker-compose.yml (zwykle /data/compose/ID/)
      # dashboard-automation będzie działać bez templates (utworzy dashboardy bez preloaded templates)
      # - /data/compose/25/config/grafana/provisioning/dashboards/templates:/app/templates:ro
    working_dir: /app
    command: python3 dashboard-automation.py
    environment:
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - GRAFANA_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - CHECK_INTERVAL=${CHECK_INTERVAL:-60}
    networks:
      - monitoring
    depends_on:
      - grafana
      - prometheus
